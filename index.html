<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venue Ticketing System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Venue Ticketing System</h1>
        <p>Find your seat!</p>
    </header>

    <main>
        <section class="venue">
            <h2>Auditorium Seating Map</h2>

            <div class="stage">STAGE</div>

            <div id="seat-map"></div>
        </section>

        <aside class="sidebar">
            <h2>Seat Details</h2>

            <div id="seat-details">
                Click a seat to see its details.
            </div>

            <button id="add-to-cart" disabled>
                ADD TO CART
            </button>

            <h2>Your Cart</h2>
            <div id="cart-items">
                Your cart is empty.
            </div>

            <p>Total: <span id="total">0</span> AZN</p>
        </aside>
    </main>
</body>
</html>
